{% extends "base.html" %}
{% block title %}Report Findings{% endblock %}
{% block content %}
<div class="page-heading">
    <h2 class="page-title">Report Findings</h2>
    <a class="action-btn primary" href="/reporting/findings/new">New Finding</a>
</div>

{% if message %}<div class="flash success">{{ message }}</div>{% endif %}
{% if error %}<div class="flash error">{{ error }}</div>{% endif %}

<div class="report-controls">
    <form class="report-filter-bar" id="report-filter-form">
        <select name="engagement_id"
                hx-get="/api/reporting/findings"
                hx-target="#report-findings-list"
                hx-swap="innerHTML"
                hx-include="#report-filter-form">
            <option value="">All engagements</option>
            {% for engagement in options.engagements %}
            <option value="{{ engagement.engagement_id }}" {% if filters.engagement_id == engagement.engagement_id %}selected{% endif %}>{{ engagement.name }}</option>
            {% endfor %}
        </select>
        <select name="status"
                hx-get="/api/reporting/findings"
                hx-target="#report-findings-list"
                hx-swap="innerHTML"
                hx-include="#report-filter-form">
            <option value="">All statuses</option>
            {% for status in options.statuses %}
            <option value="{{ status }}" {% if filters.status == status %}selected{% endif %}>{{ status }}</option>
            {% endfor %}
        </select>
        <select name="severity"
                hx-get="/api/reporting/findings"
                hx-target="#report-findings-list"
                hx-swap="innerHTML"
                hx-include="#report-filter-form">
            <option value="">All severities</option>
            {% for severity in options.severities %}
            <option value="{{ severity }}" {% if filters.severity == severity %}selected{% endif %}>{{ severity }}</option>
            {% endfor %}
        </select>
        <input type="text"
               name="q"
               value="{{ filters.q or '' }}"
               placeholder="Search title, affected, description"
               hx-get="/api/reporting/findings"
               hx-target="#report-findings-list"
               hx-trigger="keyup changed delay:300ms"
               hx-swap="innerHTML"
               hx-include="#report-filter-form">
    </form>

    <div class="report-side-actions">
        <form method="post" action="/reporting/engagements" class="compact-form">
            <input type="text" name="name" required placeholder="Engagement name">
            <input type="text" name="client_name" placeholder="Client">
            <button class="action-btn" type="submit">Create Engagement</button>
        </form>
        <form method="post" action="/reporting/reports/docx" class="compact-form">
            <select name="engagement_id" required>
                <option value="">Render engagement</option>
                {% for engagement in options.engagements %}
                <option value="{{ engagement.engagement_id }}">{{ engagement.name }}</option>
                {% endfor %}
            </select>
            <select name="status">
                <option value="">All statuses</option>
                {% for status in options.statuses %}
                <option value="{{ status }}" {% if status == 'confirmed' %}selected{% endif %}>{{ status }}</option>
                {% endfor %}
            </select>
            <button class="action-btn" type="submit">Queue DOCX</button>
        </form>
    </div>
</div>

<div id="report-findings-list">
    {% include "partials/report_findings_list.html" %}
</div>
{% endblock %}
